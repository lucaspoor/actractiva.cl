name: CI/CD Pipeline

on:
  push:
    branches: [ main ]

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  DEPLOY_DIR: /opt/atractivacl.cl

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

  deploy:
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          timeout: 600s
          script: |
            set -e
            cd "${{ env.DEPLOY_DIR }}"
            git pull --ff-only
            docker compose up -d --build
            for i in $(seq 1 30); do
              status=$(docker inspect -f '{{.State.Health.Status}}' "$(docker compose ps -q web)" 2>/dev/null || echo starting)
              [ "$status" = "healthy" ] && break
              [ "$i" = "30" ] && echo "contenedor no quedó healthy tras 150s" && exit 1
              sleep 5
            done
            docker image prune -f
