version: "3.8"

services:
  web:
    build:
      context: .
      args:
        NEXT_PUBLIC_BASE_URL: ${NEXT_PUBLIC_BASE_URL:-http://localhost:3000}
        PAYLOAD_SECRET: ${PAYLOAD_SECRET:-dev-secret-atractiva-change-me}
        SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@atractivacl.cl}
        SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-atractiva-admin}
        DATABASE_URI: file:/app/payload.db
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DATABASE_URI: file:/app/data/payload.db
      NEXT_PUBLIC_BASE_URL: ${NEXT_PUBLIC_BASE_URL:-http://localhost:3000}
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
    ports:
      - "3000:3000"
    volumes:
      - db_data:/app/data
      - media_data:/app/media
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3000/checkout').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

volumes:
  db_data:
  media_data: